name: Deploy Dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: services/analysis/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r services/analysis/requirements.txt
          pip install "services/analysis[dev]"

      - name: TypeScript tests (Jest)
        run: npm test

      - name: Python tests (pytest)
        run: pytest services/analysis/ -v

      - name: Python lint (ruff)
        run: ruff check services/analysis/

      - name: Deploy HorizonDevStack
        run: npx cdk deploy HorizonDevStack --require-approval never --outputs-file /tmp/dev-outputs.json

      - name: Show stack outputs
        run: cat /tmp/dev-outputs.json
