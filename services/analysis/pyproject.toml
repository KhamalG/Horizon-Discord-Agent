[project]
name = "horizon-analysis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "tradingagents>=0.7.0,<1.0",
    "anthropic",
    "boto3",
    "aws-lambda-powertools[all]>=3.29.0",
    "jsonschema>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock",
    "ruff>=0.4",
    "moto[dynamodb,sqs]>=5.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []
